[project]
name = "labgpt"
version = "0.3.0"
description = "Hybrid dense and lexical retrieval over a laboratory corpus, with an abstention gate, citation validation, and a labeled benchmark."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Everything needed to build the index, retrieve, and evaluate. sentence-transformers
# pulls torch and transformers in anyway, but rerank.py imports both directly, so they
# are declared rather than relied on transitively.
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24",
    "sentence-transformers>=3.0",
    "transformers>=4.44",
    "torch>=2.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# labrag is the package. labgpt_config sits beside it as a module because the corpus
# paths are also read by the scripts in tools/, which run from the repository root.
[tool.setuptools]
packages = ["labrag"]
py-modules = ["labgpt_config"]
