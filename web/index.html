<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabGPT</title>
<style>
  :root {
    --bg: #fbfaf8; --fg: #1a1a1a; --dim: #6b6b6b; --line: #e2ded8;
    --card: #fff; --accent: #2f5d50;
    --warn-bg: #fff8e6; --warn-line: #e0b95c; --warn-fg: #6b4e00;
    --stop-bg: #f6f3ef; --stop-line: #c9c2b8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --fg: #e9e6e1; --dim: #9a958d; --line: #2e3033;
      --card: #1f2124; --accent: #7fbfa8;
      --warn-bg: #2a2314; --warn-line: #7a6222; --warn-fg: #e8c86a;
      --stop-bg: #202225; --stop-line: #3a3d41;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 24px 16px 64px; }
  /* History beside the conversation, not under it. One column below 860px, with the ask
     box first: on a phone the history is reference material, not the thing you came for. */
  .layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 32px;
            align-items: start; }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; gap: 28px; }
    .side { order: 2; }
    .main { order: 1; }
  }
  /* Sticky so the list stays reachable while a long answer scrolls, and independently
     scrollable so fifty entries cannot push the page taller than the viewport. */
  /* 100vh minus the wrap's own padding (24 top, 64 bottom) and the sticky offset, so a
     full list ends exactly at the fold instead of making the whole page scroll by the
     difference. */
  .side { position: sticky; top: 24px; max-height: calc(100vh - 112px);
          overflow-y: auto; }
  @media (max-width: 860px) { .side { position: static; max-height: none; } }
  h1 { font-size: 20px; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--dim); font-size: 13px; margin-bottom: 20px; }
  form { display: flex; gap: 8px; margin-bottom: 8px; }
  /* form's display would otherwise beat the browser's [hidden] rule, and the token box
     would stay on screen after it had been saved. */
  [hidden] { display: none !important; }
  input[type=text], input[type=password] {
    flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--fg); font: inherit; min-width: 0; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { padding: 10px 16px; border: 0; border-radius: 8px; background: var(--accent);
           color: #fff; font: inherit; font-weight: 500; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .answer { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
            padding: 16px 18px; margin-top: 16px; }
  .answer.unsourced { background: var(--warn-bg); border-color: var(--warn-line); }
  .answer.refused, .answer.withheld { background: var(--stop-bg); border-color: var(--stop-line); }
  .banner { font-size: 13px; font-weight: 600; margin-bottom: 10px; color: var(--warn-fg); }
  .answer.refused .banner, .answer.withheld .banner { color: var(--dim); }
  .text { white-space: pre-wrap; }
  .meta { color: var(--dim); font-size: 12px; margin-top: 14px;
          border-top: 1px solid var(--line); padding-top: 10px; }
  .cite { margin: 6px 0 0; padding: 0; list-style: none; font-size: 13px; }
  .cite li { margin: 3px 0; }
  .tag { display: inline-block; min-width: 30px; margin-right: 6px;
         color: var(--accent); font-weight: 600; }
  .src { color: var(--dim); }
  .histbar { display: flex; align-items: baseline; justify-content: space-between;
             margin: 0 0 6px; }
  .histbar h2 { font-size: 13px; font-weight: 600; color: var(--dim); margin: 0;
                text-transform: uppercase; letter-spacing: .04em; }
  .histbar button { background: transparent; color: var(--dim); border: 0; padding: 2px 0;
                    font-size: 12px; text-decoration: underline; }
  ul.hist { list-style: none; margin: 0; padding: 0; }
  ul.hist li { border-top: 1px solid var(--line); }
  ul.hist button.item { width: 100%; text-align: left; background: transparent;
                        color: var(--fg); border: 0; padding: 9px 6px; font: inherit;
                        border-radius: 6px; line-height: 1.4; }
  ul.hist button.item:hover { background: var(--card); }
  ul.hist button.item.active { background: var(--card); box-shadow: inset 2px 0 var(--accent); }
  /* Two lines of the question, then the metadata. In a 250px column a single ellipsised
     line usually cuts before the part that distinguishes one question from another. */
  ul.hist .what { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
                  overflow: hidden; font-size: 13px; }
  ul.hist .meta2 { display: flex; gap: 8px; margin-top: 3px; font-size: 11px;
                   color: var(--dim); }
  ul.hist .badge.unsourced { color: var(--warn-fg); }
  .fromhist { font-size: 12px; color: var(--dim); margin-bottom: 10px;
              padding-bottom: 8px; border-bottom: 1px dashed var(--line); }
  /* voice */
  .iconbtn { padding: 0; width: 42px; flex: 0 0 42px; display: grid; place-items: center;
             background: var(--card); color: var(--fg); border: 1px solid var(--line); }
  .iconbtn:hover { border-color: var(--accent); }
  .iconbtn svg { width: 18px; height: 18px; display: block; }
  .iconbtn.recording { background: #b3261e; border-color: #b3261e; color: #fff; }
  .iconbtn.busy { opacity: .55; }
  .speak { margin-top: 12px; display: flex; align-items: center; gap: 10px; }
  .speak button { padding: 6px 12px; font-size: 13px; background: transparent;
                  color: var(--accent); border: 1px solid var(--line); border-radius: 6px;
                  display: inline-flex; align-items: center; gap: 7px; }
  .speak button:hover { border-color: var(--accent); }
  .speak svg { width: 14px; height: 14px; }
  .speak .state { font-size: 12px; color: var(--dim); }
  .err { color: #b3261e; margin-top: 16px; }
  @media (prefers-color-scheme: dark) { .err { color: #f2b8b5; } }
</style>

<div class="wrap">
 <div class="layout">

  <aside class="side">
    <div class="histbar" id="histbar" hidden>
      <h2>History</h2>
      <button type="button" id="clearHist">clear</button>
    </div>
    <ul class="hist" id="hist"></ul>
  </aside>

  <main class="main">
  <h1>LabGPT</h1>
  <div class="sub">Answers from the lab's indexed protocols, reagents, safety guidance,
    directory and publications. Every grounded answer cites what it used.</div>

  <form id="tokenForm" hidden>
    <input type="password" id="token" placeholder="Access token" autocomplete="current-password">
    <button type="submit">Save</button>
  </form>

  <form id="askForm">
    <input type="text" id="q" placeholder="e.g. how do I thaw BJ cells" autocomplete="off">
    <button type="button" class="iconbtn" id="mic" hidden
            title="Ask by voice" aria-label="Ask by voice">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true">
        <rect x="9" y="2" width="6" height="12" rx="3"></rect>
        <path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v4"></path>
      </svg>
    </button>
    <button type="submit" id="go">Ask</button>
  </form>

  <div id="out"></div>
  </main>

 </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const KEY = "labgpt_token";
  let token = localStorage.getItem(KEY) || "";
  if (!token) $("tokenForm").hidden = false;

  $("tokenForm").addEventListener("submit", (e) => {
    e.preventDefault();
    token = $("token").value.trim();
    localStorage.setItem(KEY, token);
    $("tokenForm").hidden = true;
    $("q").focus();
  });

  // The four modes are rendered differently on purpose. An unsourced answer that looks
  // like a sourced one is the failure this whole page is arranged to prevent.
  const BANNERS = {
    unsourced: "Not from the lab's documentation. General knowledge, no citations — confirm anything lab-specific with the protocol owner.",
    refused: "Nothing in the indexed documentation matched this.",
    withheld: "A draft was produced but cited no indexed document, so it is not shown.",
  };

  // History lives in this browser and nowhere else. The server already logs every
  // question, but that log belongs to whoever runs the service; this is the asker's own
  // copy, and keeping it local means a personal history needs no identity, no accounts
  // and no new way for one colleague's questions to be visible to another.
  //
  // The whole response is stored, not just the text, so reopening an entry shows the
  // citations it actually had and costs no tokens. The cap is on characters rather than
  // entries because one answer with six long sources is worth a dozen short ones, and
  // localStorage is a few megabytes in total for the whole origin.
  const HKEY = "labgpt_history";
  const HIST_MAX_CHARS = 400000;
  const HIST_MAX_ITEMS = 50;

  function readHist() {
    try {
      const raw = JSON.parse(localStorage.getItem(HKEY) || "[]");
      return Array.isArray(raw) ? raw : [];
    } catch (e) {
      return [];   // unreadable, a private window, or storage disabled
    }
  }

  function saveHist(items) {
    while (items.length) {
      try {
        localStorage.setItem(HKEY, JSON.stringify(items));
        return items;
      } catch (e) {
        // Quota exceeded, or storage is unavailable. Drop the oldest and try again;
        // give up quietly rather than lose the answer that is on screen.
        if (items.length <= 1) return [];
        items = items.slice(0, Math.floor(items.length / 2));
      }
    }
    return items;
  }

  function remember(data) {
    let items = readHist();
    items.unshift({ at: Date.now(), ...data });
    items = items.slice(0, HIST_MAX_ITEMS);
    let json = JSON.stringify(items);
    while (items.length > 1 && json.length > HIST_MAX_CHARS) {
      items.pop();
      json = JSON.stringify(items);
    }
    renderHist(saveHist(items));
  }

  function when(ts) {
    const d = new Date(ts), now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    return sameDay
      ? d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
      : d.toLocaleDateString([], { month: "short", day: "numeric" });
  }

  function renderHist(items) {
    items = items || readHist();
    $("histbar").hidden = items.length === 0;
    $("hist").innerHTML = items.map((item, i) =>
      '<li><button type="button" class="item" data-i="' + i + '">' +
      '<span class="what">' + esc(item.question) + "</span>" +
      '<span class="meta2"><span>' + esc(when(item.at)) + "</span>" +
      '<span class="badge ' + esc(item.mode) + '">' +
      (item.mode === "sourced" ? "[S" + (item.cited || []).join("][S") + "]"
                               : esc(item.mode)) +
      "</span></span></button></li>").join("");
  }

  $("hist").addEventListener("click", (e) => {
    const button = e.target.closest("button.item");
    if (!button) return;
    const item = readHist()[Number(button.dataset.i)];
    if (!item) return;
    $("q").value = item.question;
    render(item, item.at);
    for (const other of $("hist").querySelectorAll("button.item"))
      other.classList.toggle("active", other === button);
    window.scrollTo({ top: 0, behavior: "smooth" });
  });

  $("clearHist").addEventListener("click", () => {
    try { localStorage.removeItem(HKEY); } catch (e) { /* nothing to do */ }
    renderHist([]);
  });

  renderHist();

  // ---- voice ----------------------------------------------------------------------
  // Both directions go through this service so the ElevenLabs key stays on the server.
  // The page only ever talks to its own origin.
  let voiceReady = false, lastAnswer = null, recorder = null, chunks = [], audio = null;

  function speakControl() {
    return '<div class="speak">' +
      '<button type="button" id="speak">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M11 5 6 9H2v6h4l5 4V5z"></path>' +
      '<path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg>Read aloud</button>' +
      '<span class="state" id="speakState"></span></div>';
  }

  // The server decides whether speech exists at all; the controls appear only when it
  // does, rather than offering a button that fails.
  (async () => {
    try {
      const h = await (await fetch("/health")).json();
      voiceReady = !!h.voice;
    } catch (e) { voiceReady = false; }
    $("mic").hidden = !(voiceReady && navigator.mediaDevices &&
                        navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  })();

  $("out").addEventListener("click", async (e) => {
    if (!e.target.closest("#speak") || !lastAnswer) return;
    const button = e.target.closest("#speak");
    button.disabled = true;
    $("speakState").textContent = "generating\u2026";
    try {
      const res = await fetch("/speak", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-LabGPT-Token": token },
        body: JSON.stringify({ text: lastAnswer.answer, mode: lastAnswer.mode }),
      });
      if (!res.ok) throw new Error(((await res.json()) || {}).detail || "speech failed");
      if (audio) audio.pause();
      audio = new Audio(URL.createObjectURL(await res.blob()));
      audio.onended = () => { $("speakState").textContent = ""; };
      await audio.play();
      $("speakState").textContent = "playing";
    } catch (err) {
      $("speakState").textContent = String(err.message || err);
    } finally {
      button.disabled = false;
    }
  });

  $("mic").addEventListener("click", async () => {
    if (recorder && recorder.state === "recording") { recorder.stop(); return; }
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      $("out").innerHTML = '<div class="err">The microphone is not available: ' +
        esc(err.message || err) + "</div>";
      return;
    }
    // Chrome and Firefox record webm/opus; Safari gives mp4. The type travels with the
    // recording so the server does not have to guess.
    const type = ["audio/webm", "audio/mp4", "audio/ogg"]
      .find((t) => MediaRecorder.isTypeSupported(t)) || "";
    recorder = new MediaRecorder(stream, type ? { mimeType: type } : {});
    chunks = [];
    recorder.ondataavailable = (ev) => { if (ev.data.size) chunks.push(ev.data); };
    recorder.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop());
      $("mic").classList.remove("recording");
      $("mic").classList.add("busy");
      $("q").placeholder = "transcribing\u2026";
      try {
        const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
        const res = await fetch("/transcribe?mime=" +
                                encodeURIComponent(blob.type || "audio/webm"), {
          method: "POST",
          headers: { "Content-Type": "application/octet-stream",
                     "X-LabGPT-Token": token },
          body: blob,
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "transcription failed");
        $("q").value = data.text;
        $("askForm").dispatchEvent(new Event("submit", { cancelable: true }));
      } catch (err) {
        $("out").innerHTML = '<div class="err">' + esc(err.message || err) + "</div>";
      } finally {
        $("mic").classList.remove("busy");
        $("q").placeholder = "e.g. how do I thaw BJ cells";
      }
    };
    recorder.start();
    $("mic").classList.add("recording");
    $("q").placeholder = "listening\u2026 click the mic again to stop";
  });

  $("askForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const question = $("q").value.trim();
    if (!question) return;
    $("go").disabled = true;
    $("out").innerHTML = '<div class="answer"><div class="text">Thinking…</div></div>';
    try {
      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-LabGPT-Token": token },
        body: JSON.stringify({ question }),
      });
      if (res.status === 401) {
        localStorage.removeItem(KEY);
        $("tokenForm").hidden = false;
        $("out").innerHTML = '<div class="err">That token was not accepted. Enter it again.</div>';
        return;
      }
      const data = await res.json();
      if (!res.ok) {
        $("out").innerHTML = '<div class="err">' + esc(data.detail || "request failed") + "</div>";
        return;
      }
      render(data);
      remember(data);   // re-renders the list, which clears any active mark
    } catch (err) {
      $("out").innerHTML = '<div class="err">' + esc(String(err)) + "</div>";
    } finally {
      $("go").disabled = false;
    }
  });

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function render(d, savedAt) {
    // A stored answer is shown with the date it was given, because the corpus moves: an
    // answer from three weeks ago may cite a protocol that has been revised since, and
    // nothing on this page would otherwise say so.
    const from = savedAt
      ? '<div class="fromhist">Saved answer from ' +
        esc(new Date(savedAt).toLocaleString()) +
        ". The documents may have changed since; ask again to refresh it.</div>"
      : "";
    const banner = BANNERS[d.mode] ? '<div class="banner">' + BANNERS[d.mode] + "</div>" : "";
    let cites = "";
    if (d.cited && d.cited.length) {
      const items = d.cited.map((n) => {
        const s = d.sources[n - 1];
        return '<li><span class="tag">[S' + n + "]</span>" + esc(s.title) +
               ' <span class="src">(' + esc(s.source) + ")</span></li>";
      }).join("");
      cites = '<ul class="cite">' + items + "</ul>";
    }
    const bits = ["match " + d.best_cosine, (d.latency_ms / 1000).toFixed(1) + "s"];
    if (d.uncited_sentences) bits.push(d.uncited_sentences + " uncited sentence(s)");
    if (d.invalid_citations && d.invalid_citations.length)
      bits.push("invented citations: " + d.invalid_citations.join(", "));
    $("out").innerHTML =
      '<div class="answer ' + d.mode + '">' + from + banner +
      '<div class="text">' + esc(d.answer) + "</div>" + cites +
      '<div class="meta">' + bits.join(" · ") + "</div></div>" +
      (voiceReady ? speakControl() : "");
    lastAnswer = d;
  }
</script>
