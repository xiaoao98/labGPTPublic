# Labeled evaluation set for retrieval.
#
# Each entry names a question and the document ids that answer it. Labels are doc_ids
# rather than chunk_ids so that the set survives re-chunking: change the chunk size and
# the labels stay valid, which is the whole point of being able to sweep configurations.
#
# HOW THESE WERE WRITTEN, because it determines what the numbers mean.
#
# Questions were written by reading documents sampled from the corpus and asking what a
# lab member would plausibly want from them, deliberately in the asker's words rather than
# the document's. That last part matters: reusing a document's own vocabulary manufactures
# a win for BM25, and heavy paraphrasing manufactures one for dense retrieval. The mix of
# categories therefore decides the overall score, so the mix is declared up front and
# every metric is also reported per category. Read the per-category table, not the total.
#
#   exact_identifier   a specific value, marker or setting; favours lexical matching
#   paraphrase         asked in words the document does not use; favours dense retrieval
#   procedure_detail   a parameter or step inside a protocol; mixed
#   topic              a broad subject, several documents plausibly relevant
#   people             the team directory
#   safety             the safety corpus
#   cross_document     needs more than one document
#   unanswerable       nothing in the corpus answers it; the system must abstain
#
# LIMITS worth knowing before quoting any of this.
#
# The set is one author's judgement of relevance, not multiple annotators with an
# agreement score. At this size, differences smaller than roughly ten points in recall are
# not distinguishable from noise. Treat it as enough to choose between configurations that
# differ substantially, and not enough to tune a threshold to two decimal places.
#
# One known corpus inconsistency: safety.json is synthetic and names a laboratory manager
# who does not appear in members.tsv, which holds real people. No question here depends on
# reconciling the two.
#
# THIS SET NEEDS TWO CORPORA. Questions q063 to q088 label documents that come from a
# private laboratory database, not from PubMed Central. Running check_labels against a
# corpus built only from data/eval/manifest.json will report those doc_ids as unknown.
# That is expected and is not a broken question set; see the second_source section of the
# manifest for how the lab half is rebuilt.

