# Labeled evaluation set over a corpus with nothing private in it.
#
# The seventy-one questions of eval/questions_lab.yaml whose gold documents survive when
# the lab's protocols and reagents are replaced by public ones. Everything here can be
# sent to a hosted model, which is the point: the private set cannot, so until this
# existed the generation half of the pipeline had no question set it was allowed to run
# on end to end.
#
# THE CORPUS
#
#   members, safety, publications   the lab's own files, all three public. The member
#                                   pages are on the lab website, and the 84 papers are
#                                   published, with their abstracts and their methods and
#                                   results sections.
#   protocols, reagents             PubMed Central Open Access, fetched by
#                                   tools/fetch_eval_corpus.py. 152 protocol stages from
#                                   21 articles, every one CC BY, and 101 reagent lists.
#
# The protocol count is deliberate rather than whatever the fetch returned. An early build
# had 1232 stages against the lab corpus's 149, which makes retrieval a different and
# easier problem and the two sets not worth comparing. Whole articles are kept or dropped
# together, because the stages of one protocol belong together.
#
# Not committed, and not reconstructible from this repository alone: the publications are
# public to read, which is not the same permission as public to redistribute, and the full
# text belongs to the publishers. Rebuild it from the lab's files plus a corpus fetch.
#
# WHAT IS NOT HERE
#
# Twenty-nine questions were dropped, all of them labeled against lab protocols or
# reagents: 11 exact_identifier, 10 procedure_detail, 5 paraphrase and 3 cross_document.
# That loss is not neutral. exact_identifier is the strongest category on the private
# corpus, at 0.909 success@5, because a catalog number or a primer name either matches or
# does not, so removing it leaves a set weighted towards paraphrase and publications and
# therefore harder. Numbers from this set and from the private one are not comparable by
# subtraction.
#
# The reagent documents here have a different shape from the lab's, which no amount of
# fetching fixes. The lab keeps a formulation per cell line, so "what freezing medium does
# A549 use" has an answer; PMC gives a list of reagents per article, so it does not. No
# question in this set is labeled against a reagent.
#
# MEASURED
#
# Retrieval: overall success@5 0.870, nDCG@10 0.604 over the 54 answerable questions.
# Abstention separates at 0.646 for 88.7% on the best single threshold.
#
# Generation, gpt-5 at low reasoning effort over the older public set: no invented
# citation numbers and no uncited answers in 88 replies, which is the one property of the
# citation gate that could not be checked without a real model.
#
# LIMITS. One author's judgement of relevance, no second annotator, no agreement score. At
# n=54 answerable a difference below roughly ten points is not distinguishable from noise.

questions: whether a label is right does not depend on whether fixing it helps.
#
# This is the same mistake the note above already describes, recurring in a category that had
# not been put through exhaustive derivation. It moved overall success@5 from 0.831 to 0.904.
# The gap between hybrid retrieval and dense alone widened from 2.4 points to 7.3 once the
# noise was removed, so the bad labels had been hiding the result, not flattering it.
#
# p013 and p019 now carry 15 and 12 documents. Excluding both, the remaining ten paper_topic
# questions still score 1.000 at success@5, so the category is not resting on them.
#
# LIMITS. One author's judgement of relevance, no second annotator, no agreement score. At
# this size a difference below roughly ten points in recall is not distinguishable from
# noise. Enough to choose between configurations that differ substantially; not enough to
# tune a threshold to two decimal places.

